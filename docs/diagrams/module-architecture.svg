<svg id="module-architecture" width="100%" viewBox="0 0 2200 1100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ScreenFS module architecture</title>
  <desc id="desc">main, cli, config, matcher, fs module root, fs submodules, path, errors, and source_root backing tree relationships.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .node { fill: #eef6ff; stroke: #2563eb; stroke-width: 2; rx: 12; ry: 12; }
      .edge { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .label { font-family: Inter, Pretendard, Arial, sans-serif; fill: #111827; font-size: 28px; text-anchor: middle; }
      .label tspan.small { font-size: 24px; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="2200" height="1100"/>

  <path class="edge" d="M1100 120 L250 190"/>
  <path class="edge" d="M1100 120 L1400 190"/>
  <path class="edge" d="M410 250 L520 250"/>
  <path class="edge" d="M700 320 L350 450"/>
  <path class="edge" d="M700 320 L850 420"/>
  <path class="edge" d="M880 250 L1220 250"/>
  <path class="edge" d="M1400 330 L1200 400"/>
  <path class="edge" d="M1400 330 L1550 390"/>
  <path class="edge" d="M1500 330 L1900 410"/>
  <path class="edge" d="M1350 330 L1150 780"/>
  <path class="edge" d="M1450 330 L1550 790"/>
  <path class="edge" d="M1340 470 L540 470"/>
  <path class="edge" d="M1450 540 L1180 780"/>
  <path class="edge" d="M1760 470 L1730 470"/>
  <path class="edge" d="M1550 540 L1550 790"/>
  <path class="edge" d="M1900 540 L1900 790"/>

  <rect class="node" x="910" y="40" width="380" height="80"/>
  <text class="label" x="1100" y="78">
    <tspan x="1100">src/main.rs</tspan>
    <tspan class="small" x="1100" dy="34">LaunchArgs parse + Session::run</tspan>
  </text>

  <rect class="node" x="90" y="190" width="320" height="120"/>
  <text class="label" x="250" y="228">
    <tspan x="250">src/cli.rs</tspan>
    <tspan class="small" x="250" dy="34">--hide / --readonly-rule</tspan>
    <tspan class="small" x="250" dy="30">--policy-family / --allow-write / --config</tspan>
  </text>

  <rect class="node" x="520" y="180" width="360" height="140"/>
  <text class="label" x="700" y="218">
    <tspan x="700">src/config.rs</tspan>
    <tspan class="small" x="700" dy="34">RuntimeConfig builder</tspan>
    <tspan class="small" x="700" dy="30">typed mutability resolution</tspan>
    <tspan class="small" x="700" dy="30">CLI-over-config</tspan>
  </text>

  <rect class="node" x="1220" y="190" width="360" height="140"/>
  <text class="label" x="1400" y="228">
    <tspan x="1400">src/fs.rs</tspan>
    <tspan class="small" x="1400" dy="34">ScreenFs module root</tspan>
    <tspan class="small" x="1400" dy="30">Filesystem entrypoints</tspan>
  </text>

  <rect class="node" x="160" y="450" width="380" height="140"/>
  <text class="label" x="350" y="488">
    <tspan x="350">src/matcher.rs</tspan>
    <tspan class="small" x="350" dy="34">PathRuleMatcher + MatcherScope</tspan>
    <tspan class="small" x="350" dy="30">shared hide/readonly/allow-write rules</tspan>
  </text>

  <rect class="node" x="710" y="420" width="280" height="100"/>
  <text class="label" x="850" y="458">
    <tspan x="850">YAML mutability block</tspan>
    <tspan class="small" x="850" dy="34">family / readonly_rules / allow_write</tspan>
  </text>

  <rect class="node" x="1040" y="400" width="320" height="120"/>
  <text class="label" x="1200" y="438">
    <tspan x="1200">src/fs/state.rs</tspan>
    <tspan class="small" x="1200" dy="34">inode/path tables</tspan>
    <tspan class="small" x="1200" dy="30">file + dir handles</tspan>
  </text>

  <rect class="node" x="1340" y="390" width="420" height="150"/>
  <text class="label" x="1550" y="428">
    <tspan x="1550">src/fs/guards.rs</tspan>
    <tspan class="small" x="1550" dy="34">hidden/readonly/symlink guards</tspan>
    <tspan class="small" x="1550" dy="30">affected-coordinate checks</tspan>
  </text>

  <rect class="node" x="1730" y="410" width="340" height="130"/>
  <text class="label" x="1900" y="448">
    <tspan x="1900">src/fs/backing.rs</tspan>
    <tspan class="small" x="1900" dy="34">confined host access</tspan>
    <tspan class="small" x="1900" dy="30">open/statfs/xattr/setattr</tspan>
  </text>

  <rect class="node" x="960" y="780" width="380" height="150"/>
  <text class="label" x="1150" y="818">
    <tspan x="1150">src/path.rs</tspan>
    <tspan class="small" x="1150" dy="34">VirtualPath + rule normalization</tspan>
    <tspan class="small" x="1150" dy="30">relative/~ rebase</tspan>
    <tspan class="small" x="1150" dy="30">symlink target resolve</tspan>
  </text>

  <rect class="node" x="1390" y="790" width="320" height="110"/>
  <text class="label" x="1550" y="828">
    <tspan x="1550">src/errors.rs</tspan>
    <tspan class="small" x="1550" dy="34">ENOENT / EROFS classification</tspan>
    <tspan class="small" x="1550" dy="30">write-intent helpers</tspan>
  </text>

  <rect class="node" x="1760" y="790" width="280" height="100"/>
  <text class="label" x="1900" y="828">
    <tspan x="1900">source_root backing tree</tspan>
    <tspan class="small" x="1900" dy="34">example: real /</tspan>
  </text>
</svg>
