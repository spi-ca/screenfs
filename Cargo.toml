[package]
name = "screenfs"
version = "0.1.0"
edition = "2024"

[features]
default = []
perf-counters = []

[dependencies]
compio-runtime = "0.11.0"
fractal-fuse = "0.4.0"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[patch.crates-io]
compio-runtime = { path = "vendor/compio-runtime-0.11.0" }
