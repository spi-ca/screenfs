[package]
name = "screenfs"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/spi-ca/screenfs"

[features]
default = []
perf-counters = []

[dependencies]
compio-runtime = "0.11.0"
fractal-fuse = "0.4.0"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

